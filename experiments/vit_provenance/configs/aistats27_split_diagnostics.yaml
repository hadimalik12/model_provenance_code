experiment:
  id: aistats27_q3_imagenet_split_diagnostics
  purpose: Detect measured ImageNet train/validation distribution shift
dataset:
  source: evanarlian/imagenet_1k_resized_256
  revision: 8de107e08d1f61884d5a4ec2dea8740667264a60
  prepared_split: artifacts/vit_provenance/public_derivatives_seed0/prepared/imagenet_shard
diagnostics:
  class_balance: exact_class_frequency_comparison
  image_properties: [width, height, brightness, contrast, rgb_channel_means]
  duplicate: sha256_and_dct_perceptual_hash
  semantic_c2st:
    encoder: openai/clip-vit-base-patch32
    revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
    classifier: held_out_logistic_regression
    permutations: 200
    seed: 2027
outputs:
  run_id: artifacts/split_diagnostics/aistats27_q3/imagenet
limitations: >-
  These diagnostics can detect measured shift. They cannot prove distributional
  equality, exchangeability, unique lineage, or exact parentage.
