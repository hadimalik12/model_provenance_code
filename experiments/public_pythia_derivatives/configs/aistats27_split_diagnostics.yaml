experiment:
  id: aistats27_q3_split_diagnostics
  purpose: Detect measured MIMIR GitHub member/nonmember distribution shift
dataset:
  source: iamgroot42/mimir
  revision: 02500d3b7cece0cb7628e939ba9fc93fdb6362ae
  prepared_split: artifacts/public_pythia_derivatives/aistats27_matched/seed_0/prepared/mimir_github_matched_v3
diagnostics:
  structural: [word_count, char_count, line_count, code_symbol_fraction]
  lexical: unigram_jensen_shannon_divergence_bits
  duplicate: normalized_exact_and_word_5gram_cosine
  semantic_c2st:
    encoder: sentence-transformers/all-MiniLM-L6-v2
    revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    classifier: held_out_logistic_regression
    permutations: 200
    seed: 2027
outputs:
  run_id: artifacts/split_diagnostics/aistats27_q3/mimir_github
limitations: >-
  These diagnostics can detect measured shift. They cannot prove distributional
  equality, exchangeability, unique lineage, or exact parentage.
