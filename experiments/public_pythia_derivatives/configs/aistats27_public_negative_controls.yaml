experiment:
  id: aistats27_public_negative_controls
  purpose: Test whether the public Pile-witness audit fires without Pythia lineage
  variant: held_out_public_controls
dataset:
  source: iamgroot42/mimir/github
  revision: 02500d3b7cece0cb7628e939ba9fc93fdb6362ae
  prepared_split: artifacts/public_pythia_derivatives/aistats27_matched/seed_0/prepared/mimir_github_matched_v3
  construction_examples: 680
  evaluation_examples: 800
models:
  same_pile_unrelated_parent:
    id: EleutherAI/gpt-neo-1.3B
    revision: dbe59a7f4a88d01d1ba9798d78dbe3fe038792c8
  same_downstream_different_family:
    pythia_id: kykim0/pythia-1.4b-tulu-v2-mix
    pythia_revision: 4d21350c5197fcfc6cac0b2db277c3e9a158b303
    llama_id: allenai/tulu-2-7b
    llama_revision: 3c6e328ae91fabdd0daf09de16887de9615c1f66
    documented_training_data: allenai/tulu-v2-sft-mixture
scoring:
  primary: min_k_20_logprob
  secondary: mean_logprob
  direction: higher_is_more_member_like
  construction_criterion: balanced_accuracy
  held_out_advantage_cutoff: sqrt(log(40) / n_members)
  max_length: 512
  dtype: float16
outputs:
  run_id: 2026-11-23-public-negative-controls
  artifact_root: artifacts/public_pythia_derivatives/public_negative_controls
limitations: >-
  A positive result detects retained Pile witness information. It does not
  establish exact parentage or the route by which the model accessed the data.
